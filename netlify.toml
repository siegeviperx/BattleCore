# Netlify config for the browser client. Online play talks to the game server on Fly.io; the URL is
# baked in at build time, so changing it needs a redeploy.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_SERVER_URL = "wss://battlecore-server.fly.dev"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
